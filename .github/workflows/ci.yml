name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, so a new advisory shows up even without a push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      neo4j:
        image: neo4j:5.26 # same image as docker-compose.yml
        env:
          NEO4J_AUTH: neo4j/ci-password-123
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password-123 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-password-123
      LLM_PROVIDER: ollama
      EMBEDDING_PROVIDER: ollama
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Generate a per-run JWT secret
        run: echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Pytest (105 tests)
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build

  secrets:
    name: Security (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, not just the latest commit
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan every commit on every branch
        run: ./gitleaks git . --redact --verbose --exit-code 1 --log-opts="--all"

  python-audit:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: requirements.txt matches uv.lock
        run: |
          uv lock --check
          uv export --no-hashes --no-dev -o requirements.txt
          git diff --exit-code -- requirements.txt
      - name: pip-audit
        run: uvx pip-audit@2.10.1 -r requirements.txt --disable-pip --no-deps --desc

  npm-audit:
    name: Security (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: npm audit
        run: npm audit --audit-level=high

  docker:
    name: Docker (build, smoke test, Trivy)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26 # the image needs Neo4j to finish startup
        env:
          NEO4J_AUTH: neo4j/ci-password-123
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password-123 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: narrative-mind-api:ci
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max

      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id narrative-mind-api:ci -u)" = "10001"

      - name: Container reaches healthy
        run: |
          docker run -d --name api --network host \
            -e NEO4J_URI=bolt://localhost:7687 \
            -e NEO4J_USERNAME=neo4j \
            -e NEO4J_PASSWORD=ci-password-123 \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" \
            narrative-mind-api:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            [ "$status" = healthy ] || [ "$status" = unhealthy ] && break
            sleep 2
          done
          docker logs api
          test "$status" = healthy

      - name: Install Trivy (pinned, checksum-verified)
        env:
          TRIVY_VERSION: 0.76.0
          TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
        run: |
          curl -sSfLo trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy

      - name: Trivy (Dockerfile misconfiguration)
        run: ./trivy config --exit-code 1 --severity HIGH,CRITICAL backend

      - name: Trivy (image vulnerabilities and secrets)
        run: |
          ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --scanners vuln,secret narrative-mind-api:ci

